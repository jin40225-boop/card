<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>林彥宇｜分享預覽圖 1200×630</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f6f1e7; color: #2b2622; }
  </style>
</head>
<body>
<!-- 這一頁只用來截圖成 assets/og.png（scripts/render-assets.ps1）。視覺語言沿用 card-image.html（_spec/SaveImage.dc.html）。 -->
<div style="width: 1200px; height: 630px; box-sizing: border-box; background: #f6f1e7; position: relative; overflow: hidden; display: flex; flex-direction: column; border: 16px solid #2b2622;">

  <div style="display: flex; align-items: center; gap: 36px; padding: 0 56px; flex-grow: 1; border-bottom: 4px solid #2b2622;">
    <img src="assets/portrait-480.jpg" alt="林彥宇" style="width: 180px; height: 180px; border-radius: 50%; object-fit: cover; object-position: 50% 30%; display: block; border: 4px solid #2b2622; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 96px; font-weight: 900; letter-spacing: 0.06em; line-height: 1;">林彥宇</div>
      <div style="font-size: 32px; font-weight: 700; line-height: 1.4; color: #2b2622;">苗栗縣身心障礙者服務中心 第一區 專任督導</div>
      <div style="font-size: 22px; color: #6b625a; line-height: 1.5;">前兒少保護社工 · 社會工作碩士 · 1 永遠比 0 大</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div style="padding: 26px 32px 28px 32px; background: #dfe7dd; border-right: 4px solid #2b2622; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 48px; font-weight: 900; line-height: 1;">01</div>
      <div style="font-size: 28px; font-weight: 900; line-height: 1.25;">兒少保護<br>與家庭服務</div>
    </div>
    <div style="padding: 26px 32px 28px 32px; background: #e3ddf0; border-right: 4px solid #2b2622; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 48px; font-weight: 900; line-height: 1;">02</div>
      <div style="font-size: 28px; font-weight: 900; line-height: 1.25;">身心障礙<br>服務與督導</div>
    </div>
    <div style="padding: 26px 32px 28px 32px; background: #f5d9c4; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 48px; font-weight: 900; line-height: 1;">03</div>
      <div style="font-size: 28px; font-weight: 900; line-height: 1.25;">ADHD 親職<br>與家庭支持</div>
    </div>
  </div>
</div>
</body>
</html>
